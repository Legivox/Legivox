name: Legivox RSS + Groq dry run

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legivox-rss-groq-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Groq-compatible OpenAI client
        run: python -m pip install --disable-pip-version-check 'openai>=1.66.0,<3'
      - name: Validate script syntax
        run: python -m py_compile scripts/rss_groq.py scripts/rss_groq_dry_run.py
      - name: Fetch RSS and generate drafts (no X publishing)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        run: python scripts/rss_groq_dry_run.py
      - name: Commit dry-run preview
        if: success()
        run: |
          git add output/rss-groq-dry-run.md output/rss-groq-dry-run.json
          if git diff --cached --quiet; then
            echo 'No preview changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git commit -m 'Save RSS and Groq dry-run preview'
          git push
