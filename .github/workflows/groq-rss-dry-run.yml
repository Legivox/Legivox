name: Legivox RSS + Groq dry run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/groq-rss-dry-run.yml"
      - "scripts/rss_groq.py"

permissions:
  contents: write

concurrency:
  group: legivox-rss-groq-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Groq-compatible OpenAI client
        run: python -m pip install --disable-pip-version-check 'openai>=1.66.0,<3'
      - name: Validate script syntax
        run: python -m py_compile scripts/rss_groq.py scripts/rss_groq_dry_run.py
      - name: Exercise single-slot preparation (no X publishing)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        run: |
          if python scripts/rss_groq.py --prepare-single-post --slot 0; then
            python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          plan = json.loads(Path("output/daily-plan.json").read_text(encoding="utf-8"))
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          assert plan.get("date_ist") == today, "plan date is not today in IST"
          assert plan.get("research_source") == "RSS feeds + Groq editorial ranking", "unexpected plan source"
          posts = plan.get("posts") or []
          assert len(posts) == 1, f"expected exactly one post, got {len(posts)}"
          assert posts[0].get("slot") == 0, "generated plan does not match slot 0"
          text = str(posts[0].get("text") or "").strip()
          assert 1 <= len(text) <= 280, "post text is empty or exceeds 280 characters"
          assert "https://" in text, "post does not include a source URL"
          print("Single-slot plan validated: current date, RSS/Groq source, one post, slot 0, URL and length.")
          PY
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo 'No draft passed the local quality gate. Safe-skip behavior verified; no X publisher was invoked.'
              if [ -f output/rss-groq-latest.md ]; then
                cat output/rss-groq-latest.md
              fi
              exit 0
            fi
            exit "$status"
          fi
      - name: Commit dry-run preview
        if: success()
        run: |
          git add output/rss-groq-dry-run.md output/rss-groq-dry-run.json
          if git diff --cached --quiet; then
            echo 'No preview changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git commit -m 'Save RSS and Groq dry-run preview'
          git pull --rebase origin main
          git push
