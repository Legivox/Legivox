name: Legivox scheduled X publishing

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: legivox-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish-one-post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned publisher
        run: python -m pip install --disable-pip-version-check 'tweetkit-x==0.3.1'
      - name: Verify account, avoid duplicates, and publish one post
        env:
          TWEETKIT_COOKIE: ${{ secrets.X_SESSION_COOKIE }}
        run: python scripts/publish_next.py
      - name: Commit publishing state and audit log
        if: always()
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo 'No output state changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Legivox publishing state'
          git push
