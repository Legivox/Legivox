name: Legivox scheduled X publishing

on:
  workflow_dispatch:
  schedule:
    # Once daily at 14:00 IST. Review quality before increasing cadence.
    - cron: '30 8 * * *'

permissions:
  contents: write

concurrency:
  group: legivox-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish-one-post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate script syntax and idea data
        run: |
          python -m py_compile scripts/publish_next.py scripts/build_queue.py
          python -m json.tool data/ideas.json > /dev/null
      - name: Install publisher from the reviewed source commit
        run: >-
          python -m pip install --disable-pip-version-check
          'git+https://github.com/nsozturk/tweetkit-x.git@d42503a936f80eb0af2e9856a0fbd392cc4a750c'
      - name: Verify account, avoid duplicates, and publish one post
        env:
          TWEETKIT_COOKIE: ${{ secrets.X_SESSION_COOKIE }}
        run: python scripts/publish_next.py
      - name: Commit publishing state and audit log
        if: always()
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo 'No output state changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git commit -m 'Update Legivox publishing state'
          git push
